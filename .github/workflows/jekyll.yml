# TEMPORARY branch: renders the CV to PNG pages so they can be reviewed. Delete this branch after.
name: CV preview
on:
  push:
    branches: ["cv-preview"]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "rendercv[full]==2.8"
      - run: rendercv render _data/cv.yaml --dont-generate-png false 2>/dev/null || rendercv render _data/cv.yaml
      - run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null
          mkdir -p preview && cp files/Hollander_CV.pdf preview/ && pdftoppm -r 80 -png files/Hollander_CV.pdf preview/page
          cp rendercv_output/*.typ preview/ || true
          git config user.name "cv-preview" && git config user.email "actions@users.noreply.github.com"
          git add -f preview && git commit -m "CV preview render" && git push
